<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Styled Emblem: Stylized globe/signal using curved dots/shapes -->
  <g transform="translate(10, 15)">
    <!-- Arc 1 -->
    <circle cx="15" cy="25" r="4" fill="#0052cc" />
    <circle cx="20" cy="13" r="4" fill="#0052cc" />
    <circle cx="31" cy="6" r="4" fill="#0052cc" />
    
    <!-- Arc 2 -->
    <circle cx="28" cy="38" r="4.5" fill="#0066fe" />
    <circle cx="36" cy="25" r="4.5" fill="#0066fe" />
    <circle cx="46" cy="15" r="4.5" fill="#0066fe" />
    
    <!-- Arc 3 -->
    <circle cx="42" cy="45" r="5" fill="#00a3ff" />
    <circle cx="53" cy="36" r="5" fill="#00a3ff" />
    <circle cx="64" cy="27" r="5" fill="#00a3ff" />
  </g>
  
  <!-- Text: "global sources" -->
  <text x="95" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#1a1a1a" letter-spacing="-0.5">global <tspan fill="#0066fe">sources</tspan></text>
</svg>
